version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Application Service (PHP 8.3-FPM + Nginx + Vite Assets)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_kla_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    environment:
      APP_NAME: "${APP_NAME:-Portal KLA Konawe}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8082}"
      APP_LOCALE: "${APP_LOCALE:-id}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-id}"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-portal_kla}"
      DB_USERNAME: "${DB_USERNAME:-kla_user}"
      DB_PASSWORD: "${DB_PASSWORD:-kla_secret_password}"

      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      APP_OPTIMIZE: "${APP_OPTIMIZE:-true}"
      ENABLE_QUEUE_WORKER: "${ENABLE_QUEUE_WORKER:-false}"

      BERITA_BASE_URL: "${BERITA_BASE_URL:-https://berita.konawekab.go.id/api/v1}"
      BERITA_API_KEY: "${BERITA_API_KEY:-418595a9a453178dbdc3ea13af01789324f967e9cd60069e624de8b92003a613}"
    volumes:
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal_kla_net

  # ----------------------------------------------------------------------------
  # Database Service (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: portal_kla_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-portal_kla}"
      MYSQL_USER: "${DB_USERNAME:-kla_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-kla_secret_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret_password}"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT_FORWARD:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - portal_kla_net

  # ----------------------------------------------------------------------------
  # Redis Service (Optional: for Cache, Session, & Queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: portal_kla_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - portal_kla_net

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  storage_public:
    driver: local
  redis_data:
    driver: local

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  portal_kla_net:
    driver: bridge

